# Builds the firmware and packages the files a USB installer needs. A v* tag also publishes them
# as a GitHub release. The toolchain is pinned in firmware/ci/versions.env; see "Continuous
# integration and releases" in firmware/CLAUDE.md.
name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Outside the workspace, and the same path on every run, because the pigweed environment it holds
  # records absolute paths. The root CMakeLists.txt also writes ../platform/ESP32_custom beside it.
  ESP_MATTER_PATH: /opt/esp-matter/esp-matter

jobs:
  build:
    runs-on: ubuntu-latest
    # Keep the tag in step with IDF_VERSION in firmware/ci/versions.env.
    container: espressif/idf:v5.5.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The firmware version is `git describe`, which needs the tags and their history.
          fetch-depth: 0

      - name: Trust the checkouts
        # The container runs as root over a workspace owned by the runner user, and git describe is
        # also run in ESP-IDF's own tree.
        run: git config --global --add safe.directory '*'

      - name: Check the container matches versions.env
        run: |
          source firmware/ci/versions.env
          actual=$(git -C "$IDF_PATH" describe --tags --exact-match HEAD)
          if [ "$actual" != "$IDF_VERSION" ]; then
            echo "::error::The container has ESP-IDF $actual but versions.env pins $IDF_VERSION"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firmware/html_app/package-lock.json

      - name: Install web app dependencies
        # idf.py build runs `npm run build` itself; it only needs node_modules in place.
        run: npm ci
        working-directory: firmware/html_app

      - name: Restore esp-matter
        id: esp-matter-cache
        uses: actions/cache@v4
        with:
          path: /opt/esp-matter/esp-matter
          key: esp-matter-${{ hashFiles('firmware/ci/versions.env', 'firmware/ci/patches/esp-matter/**', 'firmware/ci/setup-toolchain.sh') }}

      - name: Set up esp-matter
        if: steps.esp-matter-cache.outputs.cache-hit != 'true'
        run: |
          # CHIP pins cffi 1.15.0, which has no wheel for the container's Python 3.12 and is built
          # from source, needing Python's headers.
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3-dev > /dev/null
          . "$IDF_PATH/export.sh" > /dev/null
          firmware/ci/setup-toolchain.sh esp-matter "$ESP_MATTER_PATH"

      - name: Patch ESP-IDF
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          firmware/ci/setup-toolchain.sh esp-idf

      - name: Build
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          # esp-matter's export.sh sets _PW_ACTUAL_ENVIRONMENT_ROOT, without which CHIP's gn step
          # fails. It can leave the shell elsewhere, hence the absolute -C.
          . "$ESP_MATTER_PATH/export.sh" > /dev/null
          idf.py -C "$GITHUB_WORKSPACE/firmware" build

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          firmware/ci/package-release.sh firmware/build dist "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: heating-monitor-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
